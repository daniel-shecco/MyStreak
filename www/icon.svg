<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pile of cash">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d3f70"/><stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect id="bgrect" width="64" height="64" rx="14" fill="url(#bg)"/>
  <g id="art">
    <!-- bundle of banknotes: stacked edges under a banded top note -->
    <g transform="translate(0 -2)">
      <rect x="11" y="34" width="42" height="6" rx="3" fill="#065f46"/>
      <rect x="12" y="29" width="40" height="6" rx="3" fill="#047857"/>
      <rect x="10.5" y="24" width="43" height="6" rx="3" fill="#059669"/>
      <rect x="12" y="14" width="40" height="12" rx="3.5" fill="url(#note)"/>
      <g fill="#065f46" opacity=".4">
        <circle cx="32" cy="20" r="3.8"/>
        <rect x="16" y="18.8" width="7" height="2.4" rx="1.2"/>
        <rect x="41" y="18.8" width="7" height="2.4" rx="1.2"/>
      </g>
      <!-- paper band holding the bundle together -->
      <rect x="27" y="12" width="10" height="30" rx="2" fill="url(#band)"/>
      <rect x="27" y="12" width="3" height="30" fill="#fff" opacity=".18"/>
    </g>
    <!-- coins spilling in front -->
    <g transform="translate(0 -1)">
      <circle cx="19" cy="49" r="9" fill="#b45309"/>
      <circle cx="19" cy="47.4" r="9" fill="url(#coin)"/>
      <circle cx="19" cy="47.4" r="5.1" fill="none" stroke="#b45309" stroke-width="1.7" opacity=".45"/>
      <circle cx="33" cy="51.4" r="7" fill="#b45309"/>
      <circle cx="33" cy="50.2" r="7" fill="url(#coin)"/>
      <circle cx="45" cy="49.6" r="6" fill="#b45309"/>
      <circle cx="45" cy="48.6" r="6" fill="url(#coin)"/>
    </g>
  </g>
</svg>
