<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spending Tracker</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1a1d27;
    --muted: #6b7280;
    --border: #e5e7eb;
    --spend: #2563eb;
    --spend-soft: #dbeafe;
    --over: #dc2626;
    --over-soft: #fee2e2;
    --over-tint: #fdf3f3;
    --accent: #f59e0b;
    --accent-soft: #fef3c7;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c;
      --card: #1c1f2b;
      --text: #eceef4;
      --muted: #9aa1b1;
      --border: #2c3040;
      --spend-soft: #16294d;
      --over-soft: #3a1618;
      --over-tint: #241519;
      --accent-soft: #3a2c0c;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .app { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 1.25rem; }

  header { text-align: center; }
  header h1 { font-size: 1.6rem; letter-spacing: -0.02em; }
  header p { color: var(--muted); font-size: .9rem; margin-top: .25rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: .8rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin-bottom: .75rem;
  }

  /* ---- Month summary ---- */
  .month-header { display: flex; align-items: center; justify-content: space-between; }
  .month-name { font-size: 1.05rem; font-weight: 700; }
  .nav-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); width: 2rem; height: 2rem; cursor: pointer;
    font-size: 1rem; line-height: 1;
  }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .total { text-align: center; margin-top: 1rem; }
  .total-amount { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .total-label { color: var(--muted); font-size: .9rem; margin-top: .2rem; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: 1.25rem; }
  .stat {
    border: 1px solid var(--border); border-radius: 12px;
    padding: .6rem .4rem; text-align: center;
  }
  .stat b { display: block; font-size: .95rem; }
  .stat span { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }

  .budget-wrap { margin-top: 1.25rem; }
  .budget-ends {
    display: flex; justify-content: space-between;
    font-size: .75rem; font-weight: 700; color: var(--muted); margin-bottom: .3rem;
  }
  .budget-track { height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .budget-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--spend), #60a5fa);
    transition: width .4s ease;
  }
  .budget-fill.over { background: linear-gradient(90deg, var(--over), #f87171); }
  .budget-text { text-align: center; color: var(--muted); font-size: .8rem; margin-top: .4rem; }

  /* Month over its limit: the whole month view goes red. */
  .app.month-over .month-card,
  .app.month-over .cal-card { border-color: var(--over); background: var(--over-tint); }
  .app.month-over .total-amount { color: var(--over); }
  .app.month-over .month-name { color: var(--over); }
  .app.month-over .budget-text { color: var(--over); font-weight: 700; }
  .app.month-over .stat { border-color: var(--over-soft); }
  .app.month-over .cell.blank { background: none; }
  .month-flag {
    display: none;
    margin-top: .75rem;
    text-align: center;
    font-size: .8rem;
    font-weight: 700;
    color: var(--over);
  }
  .app.month-over .month-flag { display: block; }

  /* ---- Calendar ---- */
  .cal-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: .35rem;
    margin-bottom: .35rem;
  }
  .cal-head {
    font-size: .65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); text-align: center; padding-bottom: .2rem;
  }
  .cell {
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 3.4rem;
    padding: .3rem .2rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cell .dnum { font-size: .65rem; color: var(--muted); font-weight: 600; }
  .cell .amt { font-size: .78rem; font-weight: 700; line-height: 1.2; word-break: break-all; }
  .cell .amt.zero { color: var(--muted); font-weight: 400; }
  .cell.spent { background: var(--spend-soft); border-color: var(--spend); }
  .cell.over { background: var(--over-soft); border-color: var(--over); }
  .cell.over .amt { color: var(--over); }
  .cell.blank { border-color: transparent; background: none; }
  .cell.clickable { cursor: pointer; }
  .cell.clickable:hover { border-color: var(--accent); }
  .cell.today .dnum { color: var(--accent); }
  .cell.today { box-shadow: inset 0 0 0 1px var(--accent); }
  .cell.selected { outline: 2px solid var(--accent); outline-offset: 1px; }

  .week-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: .3rem .6rem;
    margin-bottom: .8rem;
    font-size: .75rem;
  }
  .week-strip.empty { background: none; border-color: var(--border); }
  .week-strip .w-label { color: var(--muted); font-weight: 600; }
  .week-strip .w-amt { font-weight: 800; }
  .week-strip.empty .w-amt { font-weight: 400; color: var(--muted); }
  .cal-foot { font-size: .72rem; color: var(--muted); text-align: center; margin-top: .5rem; }

  @media (max-width: 460px) {
    body { padding: 1.25rem .6rem; }
    .card { padding: 1.1rem .9rem; }
    .total-amount { font-size: 2.5rem; }
    .cell { min-height: 3rem; }
    .cell .amt { font-size: .72rem; }
    .add-form input { font-size: .9rem; }
    #amountInput { width: 5.5rem; }
  }

  /* ---- Day detail ---- */
  .day-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .75rem; }
  .day-date { font-size: 1.05rem; font-weight: 700; }
  .day-total { font-size: 1.05rem; font-weight: 800; }
  .entries { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .85rem; }
  .entry {
    display: flex; align-items: center; gap: .6rem;
    border: 1px solid var(--border); border-radius: 10px; padding: .5rem .7rem;
  }
  .entry .e-amt { font-weight: 700; font-size: .95rem; }
  .entry .e-note { flex: 1; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .e-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1.05rem; line-height: 1; padding: 0 .15rem;
  }
  .entry .e-del:hover { color: var(--over); }
  .entries-empty { color: var(--muted); font-size: .88rem; margin-bottom: .85rem; }
  .add-form { display: flex; gap: .5rem; flex-wrap: wrap; }
  .add-form input {
    padding: .6rem .7rem; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: .95rem; min-width: 0;
  }
  #amountInput { width: 7.5rem; font-weight: 700; }
  #noteInput { flex: 1; }
  .btn {
    padding: .6rem 1.1rem; border-radius: 10px; border: none;
    background: var(--spend); color: #fff; font-weight: 700; cursor: pointer; font-size: .95rem;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: none; border: 1px solid var(--border); color: var(--muted); font-weight: 600; }
  .form-error { color: var(--over); font-size: .8rem; margin-top: .5rem; min-height: 1em; }

  /* ---- Settings / sync ---- */
  .setting-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .7rem; }
  .setting-row label { font-size: .85rem; color: var(--muted); flex: 1; }
  .setting-row input {
    width: 7rem; padding: .45rem .6rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: .9rem; text-align: right;
  }
  .sync-status { font-size: .85rem; color: var(--muted); }
  .sync-status .dot {
    display: inline-block; width: .55rem; height: .55rem; border-radius: 50%;
    margin-right: .4rem; background: var(--muted);
  }
  .sync-status.synced .dot { background: #16a34a; }
  .sync-status.error .dot { background: var(--over); }
  .sync-status.syncing .dot { background: var(--accent); }
  .sync-input { display: flex; gap: .5rem; margin-top: .6rem; }
  .sync-input input {
    flex: 1; min-width: 0; padding: .5rem .6rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: .85rem;
  }
  .sync-btn {
    padding: .5rem .9rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: .85rem;
  }
  .sync-btn.secondary { background: none; border: 1px solid var(--border); color: var(--muted); }
  .sync-actions { display: flex; gap: .5rem; margin-top: .6rem; }
  .sync-note { font-size: .75rem; color: var(--muted); margin-top: .5rem; line-height: 1.4; }
  .divider { height: 1px; background: var(--border); margin: 1rem 0; }

  footer { text-align: center; }
  footer button {
    background: none; border: none; color: var(--muted);
    font-size: .75rem; cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>💸 Spending Tracker</h1>
    <p>Log what you spend. See it by day, week, and month.</p>
  </header>

  <div class="card month-card">
    <div class="month-header">
      <button class="nav-btn" id="prevMonth" title="Previous month">‹</button>
      <div class="month-name" id="monthName">Month</div>
      <button class="nav-btn" id="nextMonth" title="Next month">›</button>
    </div>
    <div class="total">
      <div class="total-amount" id="monthTotal">0</div>
      <div class="total-label">spent this month</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statDays">0</b><span>days with spend</span></div>
      <div class="stat"><b id="statAvg">0</b><span>avg / day</span></div>
      <div class="stat"><b id="statMax">0</b><span>biggest day</span></div>
    </div>
    <div class="budget-wrap" id="budgetWrap">
      <div class="budget-ends"><span id="budgetFrom">0</span><span id="budgetTo"></span></div>
      <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
      <div class="budget-text" id="budgetText"></div>
    </div>
    <div class="month-flag" id="monthFlag"></div>
  </div>

  <div class="card cal-card">
    <div class="card-title">📅 Month at a glance</div>
    <div class="cal-row" id="calHead"></div>
    <div id="calBody"></div>
    <div class="cal-foot" id="calFoot"></div>
  </div>

  <div class="card">
    <div class="day-head">
      <div class="day-date" id="dayDate">Today</div>
      <div class="day-total" id="dayTotal">0</div>
    </div>
    <div id="entriesArea"></div>
    <form class="add-form" id="addForm">
      <input type="text" id="amountInput" inputmode="decimal" placeholder="0.00" autocomplete="off">
      <input type="text" id="noteInput" placeholder="What for? (optional)" autocomplete="off">
      <button type="submit" class="btn">Add</button>
    </form>
    <div class="form-error" id="formError"></div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ Settings</div>
    <div class="setting-row">
      <label for="currencyInput">Currency symbol</label>
      <input type="text" id="currencyInput" maxlength="3">
    </div>
    <div class="setting-row">
      <label for="dayLimitInput">Day limit — days above turn red</label>
      <input type="text" id="dayLimitInput" inputmode="decimal" placeholder="off">
    </div>
    <div class="setting-row">
      <label for="budgetInput">Monthly limit — month turns red above</label>
      <input type="text" id="budgetInput" inputmode="decimal" placeholder="off">
    </div>
    <div class="divider"></div>
    <div class="card-title">☁️ Cloud sync</div>
    <div id="syncBody"></div>
  </div>

  <footer>
    <button id="resetAll">Reset all data</button>
  </footer>
</div>

<script>
(function () {
  var STORE_KEY = "myspend-data-v1";
  var DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                     "July", "August", "September", "October", "November", "December"];

  // ---- Storage ----
  var DEFAULT_CURRENCY = "€";
  var DEFAULT_BUDGET = 60000;    // €600 per month
  var DEFAULT_DAY_LIMIT = 2000;  // €20 per day

  // Settings stay null until the user picks a value, so a synced choice can
  // win over another device's untouched default. An explicit 0 means "off".
  function blank() {
    return { version: 1, currency: null, budget: null, dayLimit: null, entries: {}, deletedIds: [] };
  }
  function currency() { return data.currency || DEFAULT_CURRENCY; }
  function budgetLimit() { return data.budget == null ? DEFAULT_BUDGET : data.budget; }
  function dayLimit() { return data.dayLimit == null ? DEFAULT_DAY_LIMIT : data.dayLimit; }
  function isDayOver(cents) { return dayLimit() > 0 && cents > dayLimit(); }
  function isMonthOver(cents) { return budgetLimit() > 0 && cents > budgetLimit(); }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var d = raw ? JSON.parse(raw) : blank();
      if (!d || typeof d !== "object") d = blank();
      if (!d.entries || typeof d.entries !== "object") d.entries = {};
      if (!Array.isArray(d.deletedIds)) d.deletedIds = [];
      if (typeof d.currency !== "string" || !d.currency) d.currency = null;
      if (typeof d.budget !== "number") d.budget = null;
      if (typeof d.dayLimit !== "number") d.dayLimit = null;
      return d;
    } catch (e) { return blank(); }
  }
  function save(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

  // ---- Money helpers (all amounts held as integer cents) ----
  function parseAmount(str) {
    if (typeof str !== "string") return null;
    var s = str.trim().replace(/[^\d.,-]/g, "");
    if (!s) return null;
    // Treat a lone comma as a decimal separator (1,50 -> 1.50); drop thousands separators.
    if (s.indexOf(",") !== -1 && s.indexOf(".") === -1) s = s.replace(",", ".");
    else s = s.replace(/,/g, "");
    var n = parseFloat(s);
    if (isNaN(n) || !isFinite(n)) return null;
    return Math.round(n * 100);
  }
  function money(cents) {
    var neg = cents < 0;
    var v = Math.abs(cents) / 100;
    return (neg ? "-" : "") + currency() + v.toFixed(2);
  }
  // Compact form for calendar cells: no symbol, and no ".00" on whole amounts.
  function compact(cents) {
    var v = cents / 100;
    return v % 1 === 0 ? String(v) : v.toFixed(2);
  }

  // ---- Date helpers ----
  function dateKey(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function mondayOf(d) {
    var m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); // Mon=0 ... Sun=6
    return m;
  }
  function sameMonth(d, y, m) { return d.getFullYear() === y && d.getMonth() === m; }

  // ---- Totals ----
  function entriesFor(key) { return data.entries[key] || []; }
  function dayTotal(key) {
    return entriesFor(key).reduce(function (sum, e) { return sum + e.cents; }, 0);
  }
  function monthDays(y, m) {
    var keys = [], last = new Date(y, m + 1, 0).getDate();
    for (var i = 1; i <= last; i++) keys.push(dateKey(new Date(y, m, i)));
    return keys;
  }
  function monthTotal(y, m) {
    return monthDays(y, m).reduce(function (sum, k) { return sum + dayTotal(k); }, 0);
  }

  // ---- State ----
  var data = load();
  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selectedKey = dateKey(today);

  // ---- Rendering ----
  function render() {
    renderSummary();
    renderCalendar();
    renderDay();
    renderSettings();
  }

  function renderSummary() {
    document.getElementById("monthName").textContent = MONTH_NAMES[viewMonth] + " " + viewYear;
    var total = monthTotal(viewYear, viewMonth);
    document.getElementById("monthTotal").textContent = money(total);

    var keys = monthDays(viewYear, viewMonth);
    var spentDays = 0, biggest = 0;
    keys.forEach(function (k) {
      var t = dayTotal(k);
      if (t !== 0) spentDays++;
      if (t > biggest) biggest = t;
    });
    // Average over elapsed days for the current month, whole month otherwise.
    var elapsed = sameMonth(today, viewYear, viewMonth) ? today.getDate() : keys.length;
    document.getElementById("statDays").textContent = spentDays;
    document.getElementById("statAvg").textContent = money(elapsed ? Math.round(total / elapsed) : 0);
    document.getElementById("statMax").textContent = money(biggest);

    var limit = budgetLimit();
    var over = isMonthOver(total);
    var wrap = document.getElementById("budgetWrap");
    if (limit <= 0) {
      wrap.style.display = "none";
    } else {
      wrap.style.display = "";
      var pct = (total / limit) * 100;
      var fill = document.getElementById("budgetFill");
      fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      fill.classList.toggle("over", over);
      document.getElementById("budgetFrom").textContent = money(0);
      document.getElementById("budgetTo").textContent = money(limit);
      var left = limit - total;
      document.getElementById("budgetText").textContent = left >= 0
        ? money(left) + " left · " + Math.round(pct) + "% of the monthly limit"
        : money(-left) + " over the monthly limit";
    }
    document.getElementById("app").classList.toggle("month-over", over);
    document.getElementById("monthFlag").textContent =
      "⚠️ Over the " + money(limit) + " monthly limit";
  }

  function renderCalendar() {
    var head = document.getElementById("calHead");
    head.innerHTML = "";
    DAY_NAMES.forEach(function (n) {
      var c = document.createElement("div");
      c.className = "cal-head";
      c.textContent = n;
      head.appendChild(c);
    });

    var body = document.getElementById("calBody");
    body.innerHTML = "";
    var todayKey = dateKey(today);
    var cursor = mondayOf(new Date(viewYear, viewMonth, 1));
    var lastDay = new Date(viewYear, viewMonth + 1, 0);

    while (cursor <= lastDay) {
      var row = document.createElement("div");
      row.className = "cal-row";
      var weekSum = 0, firstIn = null, lastIn = null;

      for (var i = 0; i < 7; i++) {
        var d = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + i);
        var cell = document.createElement("div");
        if (!sameMonth(d, viewYear, viewMonth)) {
          cell.className = "cell blank";
        } else {
          var key = dateKey(d);
          var t = dayTotal(key);
          weekSum += t;
          if (firstIn === null) firstIn = d.getDate();
          lastIn = d.getDate();
          cell.className = "cell clickable" +
            (isDayOver(t) ? " over" : t !== 0 ? " spent" : "") +
            (key === todayKey ? " today" : "") +
            (key === selectedKey ? " selected" : "");
          cell.innerHTML =
            '<div class="dnum">' + d.getDate() + "</div>" +
            '<div class="amt' + (t === 0 ? " zero" : "") + '">' + (t === 0 ? "·" : compact(t)) + "</div>";
          cell.addEventListener("click", selectDay.bind(null, key));
        }
        row.appendChild(cell);
      }

      body.appendChild(row);

      var strip = document.createElement("div");
      strip.className = "week-strip" + (weekSum === 0 ? " empty" : "");
      strip.title = "Total for the days of " + MONTH_NAMES[viewMonth] + " in this week";
      var span = MONTH_NAMES[viewMonth].slice(0, 3) + " " + firstIn +
        (lastIn !== firstIn ? "–" + lastIn : "");
      strip.innerHTML =
        '<span class="w-label">Week of ' + span + "</span>" +
        '<span class="w-amt">' + money(weekSum) + "</span>";
      body.appendChild(strip);

      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 7);
    }

    document.getElementById("calFoot").textContent =
      "Tap any day to add or edit its expenses." +
      (dayLimit() > 0 ? " Days above " + money(dayLimit()) + " turn red." : "");
  }

  function renderDay() {
    var p = selectedKey.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var label = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    if (selectedKey === dateKey(today)) label = "Today · " + label;
    document.getElementById("dayDate").textContent = label;
    var dTotal = dayTotal(selectedKey);
    var totalEl = document.getElementById("dayTotal");
    totalEl.textContent = money(dTotal);
    totalEl.style.color = isDayOver(dTotal) ? "var(--over)" : "";

    var area = document.getElementById("entriesArea");
    var list = entriesFor(selectedKey);
    if (!list.length) {
      area.innerHTML = '<div class="entries-empty">Nothing logged for this day yet.</div>';
      return;
    }
    var wrap = document.createElement("div");
    wrap.className = "entries";
    list.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "entry";
      var amt = document.createElement("div");
      amt.className = "e-amt";
      amt.textContent = money(e.cents);
      var note = document.createElement("div");
      note.className = "e-note";
      note.textContent = e.note || "";
      var del = document.createElement("button");
      del.className = "e-del";
      del.type = "button";
      del.textContent = "×";
      del.title = "Delete";
      del.addEventListener("click", deleteEntry.bind(null, selectedKey, e.id));
      row.appendChild(amt);
      row.appendChild(note);
      row.appendChild(del);
      wrap.appendChild(row);
    });
    area.innerHTML = "";
    area.appendChild(wrap);
  }

  function renderSettings() {
    var cur = document.getElementById("currencyInput");
    if (document.activeElement !== cur) cur.value = currency();
    var bud = document.getElementById("budgetInput");
    if (document.activeElement !== bud) {
      bud.value = budgetLimit() > 0 ? (budgetLimit() / 100).toFixed(2) : "";
    }
    var dl = document.getElementById("dayLimitInput");
    if (document.activeElement !== dl) {
      dl.value = dayLimit() > 0 ? (dayLimit() / 100).toFixed(2) : "";
    }
  }

  // ---- Actions ----
  function selectDay(key) {
    selectedKey = key;
    render();
    document.getElementById("amountInput").focus();
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function addEntry(cents, note) {
    if (!data.entries[selectedKey]) data.entries[selectedKey] = [];
    data.entries[selectedKey].push({ id: newId(), cents: cents, note: note });
    persist();
  }

  function deleteEntry(key, id) {
    var list = data.entries[key] || [];
    data.entries[key] = list.filter(function (e) { return e.id !== id; });
    if (!data.entries[key].length) delete data.entries[key];
    if (data.deletedIds.indexOf(id) === -1) data.deletedIds.push(id);
    persist();
  }

  function persist() {
    save(data);
    scheduleSync();
    render();
  }

  document.getElementById("addForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = document.getElementById("amountInput");
    var noteEl = document.getElementById("noteInput");
    var err = document.getElementById("formError");
    var cents = parseAmount(input.value);
    if (cents === null || cents === 0) {
      err.textContent = "Enter an amount, e.g. 12.50";
      return;
    }
    err.textContent = "";
    addEntry(cents, noteEl.value.trim());
    input.value = "";
    noteEl.value = "";
    input.focus();
  });

  document.getElementById("prevMonth").addEventListener("click", function () {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  document.getElementById("currencyInput").addEventListener("input", function () {
    data.currency = this.value.trim() || null;
    save(data);
    scheduleSync();
    render();
  });
  document.getElementById("budgetInput").addEventListener("input", function () {
    var v = this.value.trim();
    data.budget = v === "" ? 0 : (parseAmount(v) || 0);
    save(data);
    scheduleSync();
    renderSummary();
  });
  document.getElementById("dayLimitInput").addEventListener("input", function () {
    var v = this.value.trim();
    data.dayLimit = v === "" ? 0 : (parseAmount(v) || 0);
    save(data);
    scheduleSync();
    renderCalendar();
    renderDay();
  });

  document.getElementById("resetAll").addEventListener("click", function () {
    if (confirm("Delete all spending data? This cannot be undone.")) {
      var keep = data.deletedIds.slice();
      Object.keys(data.entries).forEach(function (k) {
        data.entries[k].forEach(function (e) { keep.push(e.id); });
      });
      data = blank();
      data.deletedIds = keep;
      persist();
    }
  });

  // ---- Cloud sync via the GitHub API (optional) ----
  // Spending data is committed to spending.json on a dedicated branch of this
  // repo, so it survives cleared browsers and syncs across devices.
  var TOKEN_KEY = "myspend-gh-token";
  var DATA_BRANCH = "spending-data";
  var DATA_PATH = "spending.json";
  var GH_OWNER = "daniel-shecco";
  var GH_REPO = "MyStreak";
  (function deriveRepo() {
    var h = location.hostname;
    if (h && h.indexOf(".github.io") !== -1) {
      GH_OWNER = h.split(".")[0];
      var seg = location.pathname.split("/").filter(Boolean);
      if (seg.length) GH_REPO = seg[0];
    }
  })();

  var sync = { sha: null, state: "off", message: "", timer: null, busy: false, pending: false };

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }

  function gh(path, opts) {
    opts = opts || {};
    var headers = {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + getToken()
    };
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch("https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }

  function setSyncState(state, message) {
    sync.state = state;
    sync.message = message || "";
    renderSync();
  }

  // Union entries by id across devices, minus anything either side deleted.
  function mergeData(remote, local) {
    if (!remote || typeof remote !== "object") return local;
    var out = blank();
    out.currency = local.currency || remote.currency || null;
    out.budget = local.budget != null ? local.budget : (typeof remote.budget === "number" ? remote.budget : null);
    out.dayLimit = local.dayLimit != null ? local.dayLimit : (typeof remote.dayLimit === "number" ? remote.dayLimit : null);

    var tomb = {};
    (remote.deletedIds || []).concat(local.deletedIds || []).forEach(function (id) { tomb[id] = 1; });

    var keys = {};
    Object.keys(remote.entries || {}).forEach(function (k) { keys[k] = 1; });
    Object.keys(local.entries || {}).forEach(function (k) { keys[k] = 1; });

    Object.keys(keys).forEach(function (k) {
      var byId = {};
      ((remote.entries || {})[k] || []).forEach(function (e) { if (e && e.id && !tomb[e.id]) byId[e.id] = e; });
      ((local.entries || {})[k] || []).forEach(function (e) { if (e && e.id && !tomb[e.id]) byId[e.id] = e; });
      var list = Object.keys(byId).map(function (id) { return byId[id]; });
      if (list.length) out.entries[k] = list;
    });
    out.deletedIds = Object.keys(tomb);
    return out;
  }

  function ensureBranch() {
    return gh("/branches/" + DATA_BRANCH).then(function (r) {
      if (r.ok) return;
      if (r.status !== 404) throw new Error("Branch check failed (" + r.status + ")");
      return gh("").then(function (r2) {
        if (!r2.ok) throw new Error("Repo lookup failed (" + r2.status + ") — check the token");
        return r2.json();
      }).then(function (info) {
        return gh("/branches/" + encodeURIComponent(info.default_branch)).then(function (r3) { return r3.json(); });
      }).then(function (b) {
        return gh("/git/refs", { method: "POST", body: { ref: "refs/heads/" + DATA_BRANCH, sha: b.commit.sha } });
      }).then(function (r4) {
        if (!r4.ok) throw new Error("Could not create data branch (" + r4.status + ")");
      });
    });
  }

  function pullRemote() {
    return gh("/contents/" + DATA_PATH + "?ref=" + DATA_BRANCH + "&t=" + Date.now()).then(function (r) {
      if (r.status === 404) { sync.sha = null; return null; }
      if (!r.ok) throw new Error("Read failed (" + r.status + ")");
      return r.json().then(function (f) {
        sync.sha = f.sha;
        try { return JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g, ""))))); }
        catch (e) { return null; }
      });
    });
  }

  function encode(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  }

  function pushRemote() {
    var body = { message: "Update spending data", content: encode(data), branch: DATA_BRANCH };
    if (sync.sha) body.sha = sync.sha;
    return gh("/contents/" + DATA_PATH, { method: "PUT", body: body }).then(function (r) {
      if (r.status !== 409 && r.status !== 422) return r;
      // Written from elsewhere in the meantime: pull, merge, retry once.
      return pullRemote().then(function (remote) {
        data = mergeData(remote, data);
        save(data);
        render();
        body.content = encode(data);
        if (sync.sha) body.sha = sync.sha; else delete body.sha;
        return gh("/contents/" + DATA_PATH, { method: "PUT", body: body });
      });
    }).then(function (r) {
      if (!r.ok) throw new Error("Write failed (" + r.status + ")");
      return r.json().then(function (res) { sync.sha = res.content.sha; });
    });
  }

  function scheduleSync() {
    if (!getToken()) return;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(runSync, 1500);
    setSyncState("syncing", "Saving…");
  }

  function runSync() {
    if (sync.busy) { sync.pending = true; return; }
    sync.busy = true;
    pushRemote().then(function () {
      setSyncState("synced", "Saved to GitHub");
    }, function (e) {
      setSyncState("error", e.message);
    }).then(function () {
      sync.busy = false;
      if (sync.pending) { sync.pending = false; runSync(); }
    });
  }

  function connectSync() {
    setSyncState("syncing", "Connecting…");
    ensureBranch().then(pullRemote).then(function (remote) {
      var before = JSON.stringify(remote);
      data = mergeData(remote, data);
      save(data);
      render();
      if (JSON.stringify(data) !== before) return pushRemote();
    }).then(function () {
      setSyncState("synced", "Synced with GitHub");
    }, function (e) {
      setSyncState("error", e.message);
    });
  }

  function renderSync() {
    var el = document.getElementById("syncBody");
    if (!getToken()) {
      el.innerHTML =
        '<div class="sync-status"><span class="dot"></span>Local only — data lives in this browser</div>' +
        '<div class="sync-input">' +
        '<input type="password" id="tokenInput" placeholder="Paste a GitHub token to enable sync">' +
        '<button class="sync-btn" id="connectBtn">Connect</button></div>' +
        '<div class="sync-note">Saves your spending to <code>' + DATA_PATH + '</code> on a <code>' +
        DATA_BRANCH + '</code> branch of this repo, so it survives cleared browsers and syncs across devices. ' +
        'Create a fine-grained personal access token limited to this repository with ' +
        '<b>Contents: read &amp; write</b>. The token is stored only in this browser.</div>';
      document.getElementById("connectBtn").addEventListener("click", function () {
        var t = document.getElementById("tokenInput").value.trim();
        if (!t) return;
        localStorage.setItem(TOKEN_KEY, t);
        connectSync();
      });
    } else {
      el.innerHTML =
        '<div class="sync-status ' + sync.state + '"><span class="dot"></span>' +
        (sync.message || "Connected") + "</div>" +
        '<div class="sync-actions">' +
        '<button class="sync-btn" id="syncNowBtn">Sync now</button>' +
        '<button class="sync-btn secondary" id="disconnectBtn">Disconnect</button></div>';
      document.getElementById("syncNowBtn").addEventListener("click", connectSync);
      document.getElementById("disconnectBtn").addEventListener("click", function () {
        localStorage.removeItem(TOKEN_KEY);
        sync.sha = null;
        setSyncState("off", "");
      });
    }
  }

  render();
  renderSync();
  if (getToken()) connectSync();
})();
</script>
</body>
</html>
